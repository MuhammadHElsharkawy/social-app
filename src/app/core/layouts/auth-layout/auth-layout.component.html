<div class="fixed right-4 top-4">

</div>
<section

  <div class="mx-auto flex w-full max-w-6xl flex-col items-center justify-between gap-8 lg:flex-row">

    <!-- Left Hero & Features -->
    <div class="order-1 max-w-xl lg:order-0">
      <h1 class="hidden text-6xl font-extrabold tracking-tight text-[#00298d] lg:block dark:text-blue-400">
        Loomy
      </h1>
      <p class="mt-4 hidden text-2xl font-medium text-slate-800 lg:block dark:text-slate-200">

      </p>
      <app-features-panel></app-features-panel>
    </div>

    <!-- Right Form Container Card -->
    <div class="w-full shrink-0 max-w-107.5">
      <div

        <!-- Mobile Header -->
        <div class="head mb-5 block text-center lg:hidden">
          <h1 class="text-3xl font-extrabold tracking-tight text-[#00298d] dark:text-blue-400">Loomy</h1>

        <div class="mb-5 flex items-center rounded-xl bg-slate-100 p-1 dark:bg-slate-950/70">

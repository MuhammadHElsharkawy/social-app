<header
    class="sticky top-0 z-40 border-b border-slate-200/90 bg-white/95 backdrop-blur dark:border-slate-800 dark:bg-slate-900/95 transition duration-200">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-2 px-2 py-1.5 sm:gap-3 sm:px-3">

        <!-- Brand Section -->
        <div class="flex items-center gap-3">
            <img alt="Loomy" class="h-9 w-9 rounded-xl object-cover ring-1 ring-slate-200 dark:ring-slate-700"
                src="default-profile.png" />
            <p class="hidden text-xl font-extrabold text-slate-900 sm:block dark:text-slate-100">Loomy</p>
        </div>

        <!-- Navigation Pills -->
        <nav
            class="flex min-w-0 items-center gap-1 overflow-x-auto scrollbar-none rounded-2xl border border-slate-200 bg-slate-50/90 px-1 py-1 sm:px-1.5 dark:border-slate-800 dark:bg-slate-950/60 transition duration-200">
            <a class="relative flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-sm font-extrabold text-slate-600 transition hover:bg-white/90 hover:text-slate-900 sm:gap-2 sm:px-3.5 dark:text-slate-400 dark:hover:bg-slate-800/80 dark:hover:text-slate-100"
                routerLinkActive="bg-white text-[#1f6fe5]! shadow-xs dark:bg-slate-800 dark:text-[#60a5fa]!"
                routerLink="/home">
                <span>
                    <svg lucideHouse class="size-5"></svg>
                </span>
                <span class="hidden sm:inline">Home</span>
                <span class="sr-only sm:hidden">Home</span>
            </a>

            <a class="relative flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-sm font-extrabold text-slate-600 transition hover:bg-white/90 hover:text-slate-900 sm:gap-2 sm:px-3.5 dark:text-slate-400 dark:hover:bg-slate-800/80 dark:hover:text-slate-100"
                routerLinkActive="bg-white text-[#1f6fe5]! shadow-xs dark:bg-slate-800 dark:text-[#60a5fa]!"
                routerLink="/profile">
                <span>
                    <svg lucideUser class="size-5"></svg>
                </span>
                <span class="hidden sm:inline">Profile</span>
                <span class="sr-only sm:hidden">Profile</span>
            </a>

            <a class="relative flex items-center gap-1.5 rounded-xl px-2.5 py-2 text-sm font-extrabold text-slate-600 transition hover:bg-white/90 hover:text-slate-900 sm:gap-2 sm:px-3.5 dark:text-slate-400 dark:hover:bg-slate-800/80 dark:hover:text-slate-100"
                routerLinkActive="bg-white text-[#1f6fe5]! shadow-xs dark:bg-slate-800 dark:text-[#60a5fa]!"
                routerLink="/notifications">
                <span class="relative">
                    <svg lucideMessageCircle class="size-5"></svg>
                    <span
                        class="absolute -right-2 -top-2 inline-flex min-w-4 items-center justify-center rounded-full bg-[#ef4444] px-1 text-[10px] font-black leading-4 text-white">
                        11
                    </span>
                </span>
                <span class="hidden sm:inline">Notifications</span>
                <span class="sr-only sm:hidden">Notifications</span>
            </a>
        </nav>

        <!-- User Profile & Action Menu -->
        <div class="relative flex items-center gap-2" (appClickOutside)="isOpen.set(false)">
            <button (click)="toggleDropdown()"
                class="flex cursor-pointer items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-2 py-1.5 transition hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-800/80 dark:hover:bg-slate-700/70">
                <img alt="Muhammad Elsharkawy"
                    class="h-8 w-8 rounded-full object-cover ring-1 ring-slate-200 dark:ring-slate-600"
                    src="default-profile.png" />
                <span
                    class="hidden max-w-35 truncate text-sm font-semibold text-slate-800 md:block dark:text-slate-200">
                    Muhammad Elsharkawy
                </span>
                <svg lucideMenu class="size-3.75 text-slate-500 dark:text-slate-400"></svg>
            </button>

            <!-- Dropdown Surface (Elevated Layer) -->
            @if (isOpen()) {
            <div #Dropdown
                class="header-dropdown absolute right-0 top-full z-50 mt-2 w-52 rounded-xl border border-slate-200 bg-white p-2 shadow-lg dark:border-slate-700 dark:bg-slate-800 dark:shadow-2xl dark:shadow-black/50">
                <button
                    class="flex w-full cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700/60 dark:hover:text-white">
                    <svg lucideUser class="size-4 text-slate-500 dark:text-slate-400"></svg>
                    Profile
                </button>

                <button (click)="onSettingsClick()"
                    class="flex w-full cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700/60 dark:hover:text-white">
                    <svg lucideSettings class="size-4 text-slate-500 dark:text-slate-400"></svg>
                    Settings
                </button>

                <div class="my-1 border-t border-slate-200 dark:border-slate-700/80"></div>

                <button (click)="authService.logOut()"
                    class="flex w-full cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-rose-600 transition hover:bg-rose-50 dark:text-rose-400 dark:hover:bg-rose-950/40">
                    Logout
                </button>
            </div>
            }
            <div class="">
                <app-theme-switcher></app-theme-switcher>
            </div>
        </div>
    </div>
</header>

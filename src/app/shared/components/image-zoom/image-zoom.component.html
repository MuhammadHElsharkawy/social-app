<div class="fixed inset-0 z-80 flex items-center justify-center bg-black/90 p-4 sm:p-8">
  <button
    (click)="handleCloseClick()"
    type="button"
    class="cursor-pointer absolute right-4 top-4 inline-flex h-10 w-10 items-center justify-center rounded-full bg-white/10 text-white transition hover:bg-white/20"
  >
    <svg lucideX class="size-5"></svg>
  </button>
  <img
    (appClickOutside)="handleCloseClick()"
    [alt]="imageAlt()"
    class="max-h-full max-w-full object-contain"
    [src]="imageSrc()"
    loading="lazy"
  />
</div>

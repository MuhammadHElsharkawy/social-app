<div
  class="fixed inset-0 z-71 flex items-center justify-center bg-slate-900/65 p-4 backdrop-blur-xs dark:bg-black/75"
>
  <div
    class="w-full max-w-130 rounded-2xl border border-slate-200 bg-white shadow-2xl transition-colors duration-200 dark:border-slate-800 dark:bg-slate-900 dark:shadow-black/60"
    (appClickOutside)="handleCloseClick()"
  >
    <!-- Modal Header -->
    <div
      class="flex items-center justify-between border-b border-slate-200 px-4 py-3 dark:border-slate-800"
    >
      <div class="flex items-center gap-2">
        <svg lucideUsers class="size-4.25 text-[#1877f2] dark:text-blue-400"></svg>
        <h4 class="text-base font-extrabold text-slate-900 dark:text-slate-100">
          People who reacted
        </h4>
      </div>
      <button
        (click)="handleCloseClick()"
        type="button"
        class="inline-flex h-8 w-8 cursor-pointer items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
      >
        <svg lucideX class="size-4"></svg>
      </button>
    </div>

    <!-- Modal Body / User List -->
    <div class="max-h-105 overflow-y-auto px-2 py-2">
      <div class="space-y-1">
        @if (postLikesLoading()) {
          <p
            class="rounded-xl py-8 text-center text-sm font-semibold text-slate-600 dark:bg-slate-950/40 dark:text-slate-400"
          >
            Loading likes...
          </p>
        } @else {
          @for (like of postLikes(); track like._id) {
            <app-post-like-card [like]="like"></app-post-like-card>
          }
        }
      </div>
    </div>
  </div>
</div>

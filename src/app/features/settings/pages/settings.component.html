<div class="mx-auto max-w-4xl space-y-4">
  <!-- Page Header -->
  <div class="border-b border-slate-200 pb-4 dark:border-slate-800">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100 sm:text-3xl">
      Settings
    </h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
      Manage your workspace preferences, appearance, and security credentials.
    </p>
  </div>

  <!-- SECTION 1: GENERAL & APPEARANCE -->
  <section
    class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm transition-colors duration-200 dark:border-slate-800 dark:bg-slate-900 dark:shadow-xl dark:shadow-black/30 sm:p-7"
  >
    <div class="mb-6">
      <h2 class="text-lg sm:text-xl font-semibold text-slate-900 dark:text-slate-100">
        General Preferences
      </h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 sm:text-sm">
        Customize visual mode and language options.
      </p>
    </div>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
      <div>
        <label
          class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300"
        >
          Appearance
        </label>
        <div class="flex items-center gap-1 rounded-xl bg-slate-100 p-1 dark:bg-slate-950/60">
          <!-- Light Mode -->
          <button
            type="button"
            (click)="themeService.setMode('light')"
            [class]="
              themeService.mode() === 'light'
                ? 'bg-white text-slate-900 shadow-sm font-semibold dark:bg-slate-800 dark:text-slate-100'
                : 'text-slate-500 hover:text-slate-700 font-medium dark:text-slate-400 dark:hover:text-slate-200'
            "
            class="flex flex-1 cursor-pointer items-center justify-center gap-2 rounded-lg py-2 text-xs transition-all sm:text-sm"
          >
            <svg lucideSun class="size-4"></svg>
            Light
          </button>

          <!-- Dark Mode -->
          <button
            type="button"
            (click)="themeService.setMode('dark')"
            [class]="
              themeService.mode() === 'dark'
                ? 'bg-white text-slate-900 shadow-sm font-semibold dark:bg-slate-800 dark:text-slate-100'
                : 'text-slate-500 hover:text-slate-700 font-medium dark:text-slate-400 dark:hover:text-slate-200'
            "
            class="flex flex-1 cursor-pointer items-center justify-center gap-2 rounded-lg py-2 text-xs transition-all sm:text-sm"
          >
            <svg lucideMoon class="size-4"></svg>
            Dark
          </button>

          <!-- System Mode -->
          <button
            type="button"
            (click)="themeService.setMode('system')"
            [class]="
              themeService.mode() === 'system'
                ? 'bg-white text-slate-900 shadow-sm font-semibold dark:bg-slate-800 dark:text-slate-100'
                : 'text-slate-500 hover:text-slate-700 font-medium dark:text-slate-400 dark:hover:text-slate-200'
            "
            class="flex flex-1 cursor-pointer items-center justify-center gap-2 rounded-lg py-2 text-xs transition-all sm:text-sm"
          >
            <svg lucideMonitor class="size-4"></svg>
            System
          </button>
        </div>
      </div>

      <!-- Language Selector -->
      <div>
        <label
          class="mb-2 block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300"
        >
          Language
        </label>
        <div class="relative">
          <select
            class="w-full cursor-pointer rounded-xl border border-slate-300 bg-white px-4 py-2.5 pr-10 text-sm font-medium text-slate-800 transition focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 dark:border-slate-800 dark:bg-slate-950/60 dark:text-slate-100 dark:focus:border-blue-400 dark:focus:ring-blue-400/20"
            (change)="changeLanguage($event)"
          >
            <option
              [selected]="languageService.currentLanguage() === 'en'"
              value="en"
              class="dark:bg-slate-900 dark:text-slate-100"
            >
              English (US)
            </option>
            <option
              [selected]="languageService.currentLanguage() === 'ar'"
              value="ar"
              class="dark:bg-slate-900 dark:text-slate-100"
            >
              Arabic (العربية)
            </option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- SECTION 2: SECURITY & PASSWORDS -->
  <section
    class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm transition-colors duration-200 dark:border-slate-800 dark:bg-slate-900 dark:shadow-xl dark:shadow-black/30 sm:p-7"
  >
    <app-change-password></app-change-password>
  </section>
</div>

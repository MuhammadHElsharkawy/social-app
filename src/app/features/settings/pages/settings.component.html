<div class="min-h-screen bg-slate-100 dark:bg-slate-950 flex items-center justify-center p-4">
  
  <div class="w-full max-w-xl bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-150 dark:border-slate-800 p-8">
    
    <!-- Tabs Navigation Bar -->
    <div class="relative flex items-center p-1.5 bg-slate-100 dark:bg-slate-950/60 rounded-2xl border border-slate-200/80 dark:border-slate-800 mb-8">
      
      <!-- Animated Sliding Background -->
      <div 
        class="absolute top-1.5 bottom-1.5 left-1.5 w-[calc(50%-6px)] rounded-xl bg-white dark:bg-slate-800 shadow-sm border border-slate-200/50 dark:border-slate-700/50 transition-transform duration-200 ease-out pointer-events-none"
        [class.translate-x-full]="activeTab() === 'security'"
        [class.translate-x-0]="activeTab() === 'settings'">
      </div>

      <!-- General Tab Button -->
      <a 
        routerLink="./" 
        routerLinkActive="text-blue-600! dark:text-blue-400!"
        [routerLinkActiveOptions]="{ exact: false }"
        class="relative z-10 flex-1 py-2.5 px-4 text-center text-sm font-medium rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-colors duration-200">
        General
      </a>

      <!-- Security Tab Button -->
      <a 
        routerLink="security" 
        routerLinkActive="text-blue-600! dark:text-blue-400!"
        [routerLinkActiveOptions]="{ exact: false }"
        class="relative z-10 flex-1 py-2.5 px-4 text-center text-sm font-medium rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 transition-colors duration-200">
        Security
      </a>

    </div>

    <!-- Active Tab Component Outlet -->
    <router-outlet></router-outlet>

  </div>

</div>

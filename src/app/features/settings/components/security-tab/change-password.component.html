<div id="tab-security" class="tab-content block">
  <div class="mb-6">
    <h1 class="text-lg font-semibold text-slate-900 dark:text-slate-100 sm:text-xl">
      {{ 'CHANGE_PASSWORD.TITLE' | translate }}
    </h1>
    <p class="text-sm text-slate-500">{{ 'CHANGE_PASSWORD.DESC' | translate }}</p>
  </div>

  <!-- Form Elements -->
  <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()" class="space-y-4">
    <div>
      <lib-input
        inputId="ch-currentPass"
        type="password"
        [placeholder]="'PLACEHOLDER.CURRENT_PASS' | translate"
        [label]="'FORM.CURRENT_PASS' | translate"
        styleClass="py-2.5! px-3!"
        formControlName="password"
      ></lib-input>
    </div>
    <div>
      <lib-input
        inputId="ch-newPassword"
        type="password"
        [placeholder]="'PLACEHOLDER.NEW_PASS' | translate"
        [label]="'FORM.NEW_PASS' | translate"
        styleClass="py-2.5! px-3!"
        formControlName="newPassword"
      ></lib-input>
      <span class="mt-1 block text-xs text-slate-500">
        {{ 'COMMON.VALIDATION.PASSWORD_PATTERN' | translate }}
      </span>
    </div>
    <div>
      <lib-input
        inputId="ch-confirmPassword"
        type="password"
        [placeholder]="'PLACEHOLDER.CONFIRM_PASS' | translate"
        [label]="'FORM.CONFIRM_PASS' | translate"
        styleClass="py-2.5! px-3!"
        formControlName="confirmPassword"
      ></lib-input>
    </div>
    <button
      type="submit"
      [disabled]="changePasswordForm.invalid || isLoading()"
      class="inline-flex w-full items-center justify-center rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5] enabled:cursor-pointer disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (isLoading()) {
        {{ 'COMMON.MESSAGES.UPDATING_PASSWORD' | translate }}
      } @else {
        {{ 'CHANGE_PASSWORD.SUBMIT_BTN' | translate }}
      }
    </button>
    <app-form-error-message [errorMessage]="errorMessage()"></app-form-error-message>
  </form>
</div>

<div
  class="fixed inset-0 z-70 flex items-center justify-center bg-slate-900/65 p-4 backdrop-blur-xs transition-colors dark:bg-slate-950/80"
>
  <div
    class="w-full max-w-140 rounded-2xl border border-slate-200 bg-white shadow-2xl transition-colors dark:border-slate-800 dark:bg-slate-900 dark:shadow-black/60"
    (appClickOutside)="handleCloseClick()"
  >
    <!-- Modal Header -->
    <div
      class="flex items-center justify-between border-b border-slate-200 px-4 py-3 dark:border-slate-800"
    >
      <h4 class="text-base font-extrabold text-slate-900 dark:text-slate-100">Share post</h4>
      <button
        type="button"
        class="inline-flex h-8 w-8 cursor-pointer items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 disabled:opacity-60 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
        (click)="handleCloseClick()"
      >
        <svg lucideX class="size-4"></svg>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="space-y-3 p-4">
      <textarea
        [(ngModel)]="body"
        placeholder="Say something about this..."
        rows="3"
        maxlength="500"
        class="w-full resize-none rounded-xl border border-slate-300 px-3 py-2 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#1877f2] focus:ring-2 focus:ring-[#1877f2]/20 dark:border-slate-700 dark:bg-slate-950/60 dark:text-slate-100 dark:placeholder:text-slate-500 dark:ring-blue-500/20 dark:focus:border-blue-400"
      ></textarea>

      <!-- Embedded Post Preview Card -->
      <div
        class="rounded-xl border border-slate-200 bg-slate-50 p-3 transition-colors dark:border-slate-800 dark:bg-slate-950/40"
      >
        <div class="flex items-center gap-2">
          <img
            [alt]="post().user.name"
            class="h-8 w-8 rounded-full object-cover ring-1 ring-slate-200 dark:ring-slate-700"
            [src]="post().user.photo"
          />
          <div class="min-w-0">
            <p class="truncate text-sm font-bold text-slate-900 dark:text-slate-100">
              {{ post().user.name }}
            </p>
            <p class="truncate text-xs font-semibold text-slate-500 dark:text-slate-400">
              @{{ post().user.username }}
            </p>
          </div>
        </div>
        @if (post().body) {
          <p class="mt-2 whitespace-pre-wrap text-sm text-slate-800 dark:text-slate-200">
            {{ post().body }}
          </p>
        }
        @if (post().image) {
          <img
            alt="post preview"
            class="mt-2 max-h-55 w-full rounded-lg object-cover ring-1 ring-slate-200/50 dark:ring-slate-800"
            [src]="post().image"
          />
        }
      </div>
    </div>

    <!-- Modal Footer -->
    <div
      class="flex items-center justify-end gap-2 border-t border-slate-200 px-4 py-3 dark:border-slate-800"
    >
      <button
        type="button"
        class="cursor-pointer rounded-lg border border-slate-300 px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-100 disabled:opacity-60 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white"
        (click)="handleCloseClick()"
        [disabled]="loading()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="inline-flex cursor-pointer items-center rounded-lg bg-[#1877f2] px-4 py-2 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:opacity-60 dark:bg-blue-600 dark:hover:bg-blue-500 dark:disabled:bg-slate-800 dark:disabled:text-slate-500"
        (click)="handleShareClick()"
        [disabled]="loading()"
      >
        @if (loading()) {
          Sharing...
        } @else {
          Share now
        }
      </button>
    </div>
  </div>
</div>

<article
  class="overflow-visible rounded-xl border border-slate-200 bg-white shadow-sm transition-colors duration-200 dark:border-slate-800 dark:bg-slate-900 dark:shadow-xl dark:shadow-black/30"
>
  <!-- Post Header & Body -->
  <div class="p-4">
    <div class="flex items-center gap-3">
      <a class="shrink-0" href="#/profile/6a7f2b158ebe92c2c02d0bd0">
        <img
          loading="lazy"
          [alt]="post().user.name"
          class="h-11 w-11 rounded-full object-cover ring-1 ring-slate-200 dark:ring-slate-700"
          [src]="post().user.photo"
        />
      </a>

      <div class="min-w-0 flex-1">
        <a
          class="truncate text-sm font-bold text-slate-900 hover:underline dark:text-slate-100"
          href="#/profile/6a7f2b158ebe92c2c02d0bd0"
        >
          {{ post().user.name }}
        </a>
        <div class="flex flex-wrap items-center gap-1 text-xs text-slate-500 dark:text-slate-400">
          @{{ post().user.username }} ·
          <button
            type="button"
            class="rounded px-0.5 py-0.5 text-xs font-semibold text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 hover:underline dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
          >
            12h
          </button>
          <span class="mx-1">·</span>
          <span class="inline-flex items-center gap-1">
            <svg lucideEarth class="size-2.75"></svg>
            {{ post().privacy }}
          </span>
        </div>
      </div>

      <!-- More Options Button -->
      <div class="relative">
        <button
          class="cursor-pointer rounded-full p-1.5 text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
        >
          <svg lucideEllipsis class="size-4.5"></svg>
        </button>
      </div>
    </div>

    <!-- Post Text Content -->
    <div class="mt-3">
      <p class="whitespace-pre-wrap text-sm leading-relaxed text-slate-800 dark:text-slate-200">
        {{ post().body }}
      </p>
    </div>
  </div>

  <!-- Post Image Area -->
  @if (post().image) {
    <div class="max-h-155 overflow-hidden border-y border-slate-200 dark:border-slate-800">
      <button type="button" class="group relative block w-full cursor-zoom-in">
        <img loading="lazy" alt="post" class="w-full object-cover" [src]="post().image" />
        <span
          class="pointer-events-none absolute inset-0 bg-black/0 transition group-hover:bg-black/10 dark:group-hover:bg-white/5"
        ></span>
      </button>
    </div>
  }

  <!-- Stats & Counters -->
  <div class="px-4 pb-2 pt-3 text-sm text-slate-500 dark:text-slate-400">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <!-- Likes Count -->
      <div class="flex items-center gap-2">
        <span
          class="inline-flex h-5 w-5 items-center justify-center rounded-full bg-[#1877f2] text-white shadow-xs dark:bg-blue-600"
        >
          <svg lucideThumbsUp class="size-3"></svg>
        </span>
        <button
          (click)="handleLikesCountClick()"
          type="button"
          class="font-semibold transition"
          [class]="
            post().likesCount > 0
              ? 'cursor-pointer hover:text-[#1877f2] hover:underline dark:hover:text-blue-400'
              : ''
          "
        >
          {{ post().likesCount }} likes
        </button>
      </div>

      <!-- Comments, Shares & Details -->
      <div class="flex flex-wrap items-center gap-2 text-xs sm:gap-3 sm:text-sm">
        <span class="inline-flex items-center gap-1">
          <svg lucideRepeat2 class="size-3.25"></svg>
          {{ post().sharesCount }} shares
        </span>
        <span>{{ post().commentsCount }} comments</span>
        <button
          class="cursor-pointer rounded-md px-2 py-1 text-xs font-bold text-[#1877f2] transition hover:bg-[#e7f3ff] dark:text-blue-400 dark:hover:bg-blue-950/60"
        >
          View details
        </button>
      </div>
    </div>
  </div>

  <!-- Divider -->
  <div class="mx-4 border-t border-slate-200 dark:border-slate-800"></div>

  <!-- Action Bar Buttons -->
  <div class="grid grid-cols-3 gap-1 p-1">
    <button
      (click)="handleLikeClick()"
      class="flex cursor-pointer items-center justify-center gap-1.5 rounded-lg p-2 text-xs font-semibold transition-colors disabled:cursor-not-allowed disabled:opacity-50 sm:gap-2 sm:text-sm"
      [class]="likeClasses()"
    >
      <svg lucideThumbsUp class="size-4.5"></svg>
      <span>Like</span>
    </button>

    <button
      (click)="handleCommentClick()"
      class="flex cursor-pointer items-center justify-center gap-1.5 rounded-lg p-2 text-xs font-semibold text-slate-600 transition-colors hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 sm:gap-2 sm:text-sm dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
    >
      <svg lucideMessageCircle class="size-4.5"></svg>
      <span>Comment</span>
    </button>

    <button
      class="flex cursor-pointer items-center justify-center gap-1.5 rounded-lg p-2 text-xs font-semibold text-slate-600 transition-colors hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 sm:gap-2 sm:text-sm dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
    >
      <svg lucideShare2 class="size-4.5"></svg>
      <span>Share</span>
    </button>
  </div>
  @if (post().topComment) {
    <app-post-top-comment [topComment]="post().topComment!"></app-post-top-comment>
  }
</article>
@if (openPostLikes()) {
  <app-post-likes
    [postLikes]="postLikes()"
    [postLikesLoading]="postLikesLoading()"
    (closePostLikes)="openPostLikes.set(false)"
  ></app-post-likes>
}

<div
  class="mx-4 my-3 overflow-hidden rounded-xl border border-slate-200 bg-slate-50 transition-colors dark:border-slate-700/60 dark:bg-slate-800/50"
>
  <div class="p-3">
    <!-- User Info & Link Header -->
    <div class="mb-2 flex items-center gap-2">
      <img
        [alt]="post().user.name"
        class="h-9 w-9 rounded-full object-cover ring-1 ring-slate-200 dark:ring-slate-700"
        [src]="post().user.photo"
      />
      <div class="min-w-0">
        <p class="truncate text-sm font-bold text-slate-900 dark:text-slate-100">
          {{ post().user.name }}
        </p>
        <p class="truncate text-xs text-slate-500 dark:text-slate-400">
          @{{ post().user.username }}
        </p>
      </div>
      <button
        type="button"
        class="ml-auto inline-flex cursor-pointer items-center gap-1 rounded-lg px-2 py-1 text-xs font-bold text-[#1877f2] transition hover:bg-[#e7f3ff] dark:text-blue-400 dark:hover:bg-blue-950/80"
      >
        Original Post
        <svg lucideExternalLink class="size-3.75"></svg>
      </button>
    </div>

    <!-- Post Body Text -->
    @if (post().body) {
      <p class="whitespace-pre-wrap text-sm leading-relaxed text-slate-800 dark:text-slate-200">
        {{ post().body }}
      </p>
    }
  </div>

  <!-- Shared Image Attachment -->
  @if (post().image) {
    <div class="border-t border-slate-200 dark:border-slate-700/60">
      <button
        type="button"
        class="group relative block w-full cursor-pointer"
        (click)="openPostImage.set(true)"
      >
        <img
          [alt]="post().user.name + ' Shared post'"
          class="max-h-140 w-full object-cover"
          [src]="post().image"
        />
        <span
          class="pointer-events-none absolute inset-0 bg-black/0 transition group-hover:bg-black/10 dark:group-hover:bg-white/5"
        ></span>
      </button>
    </div>
  }
</div>

@if (openPostImage()) {
  <app-image-zoom
    [imageSrc]="post().image!"
    [imageAlt]="post().user.name + ' post image'"
    (onClose)="openPostImage.set(false)"
  ></app-image-zoom>
}

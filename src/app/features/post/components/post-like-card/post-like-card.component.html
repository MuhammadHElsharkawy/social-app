<a

  href="#/profile/6a78b5768ebe92c2c01e3409"
>
  <img
    loading="lazy"
    [alt]="like().name"
    class="h-10 w-10 rounded-full object-cover ring-1 ring-slate-200 dark:ring-slate-700"

    <p class="truncate text-sm font-bold text-slate-900 dark:text-slate-100">

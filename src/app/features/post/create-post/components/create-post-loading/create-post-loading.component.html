<div class="post-uploading-card">
  <div class="upload-progress-bar">
    <div class="upload-progress-indicator"></div>
  </div>

  <div class="post-card-content">
    @if (data()?.previewUrl) {
      <div class="avatar-placeholder">
        <img [src]="data()?.previewUrl" alt="" />
      </div>
    }
    <div class="post-status-info">
      <span class="status-text">Posting to your feed...</span>
      <span class="sub-text">Just a moment</span>
      @if (data()?.body) {
        <p class="post-body-snippet">{{ data()?.body }}</p>
      }
    </div>
  </div>
</div>

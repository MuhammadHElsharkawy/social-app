<div
  class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition-colors duration-200 dark:border-slate-800 dark:bg-slate-900 dark:shadow-xl dark:shadow-black/30"
>
  <!-- Header: Avatar, Name & Privacy Selector -->
  <div class="mb-3 flex items-start gap-3">
    <img
      alt="Muhammad Elsharkawy"
      class="h-11 w-11 rounded-full object-cover ring-1 ring-slate-200 dark:ring-slate-700"
      src="default-profile.png"
    />
    <div class="flex-1">
      <p class="text-base font-extrabold text-slate-900 dark:text-slate-100">Muhammad Elsharkawy</p>

      <!-- Privacy Pill -->
      <div
        class="mt-1 inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-semibold text-slate-700 dark:bg-slate-800 dark:text-slate-300"
      >
        <svg lucideEarth class="size-3 text-slate-500 dark:text-slate-400"></svg>
        <lib-select-input
          styleType="create-post"
          inputId="create-post-privacy"
          [options]="privacyOptions"
        ></lib-select-input>
        <!-- <select class=" bg-transparent outline-none dark:bg-slate-800 dark:text-slate-200">
                    <option value="public" class="dark:bg-slate-800 dark:text-slate-200">Public</option>
                    <option value="following" class="dark:bg-slate-800 dark:text-slate-200">Followers</option>
                    <option value="only_me" class="dark:bg-slate-800 dark:text-slate-200">Only me</option>
                </select> -->
      </div>
    </div>
  </div>

  <!-- Textarea Area -->
  <div class="relative">
    <textarea
      [(ngModel)]="body"
      rows="4"
      placeholder="What's on your mind, Muhammad?"
      class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-[17px] leading-relaxed text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-[#1877f2] focus:bg-white dark:border-slate-800 dark:bg-slate-950/60 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-blue-500 dark:focus:bg-slate-950"
    ></textarea>
  </div>

  <!-- Image Preview -->
  @if (previewUrl()) {
    <div class="relative mt-2">
      <img alt="Preview" class="max-h-60 w-full rounded-lg object-cover" [src]="previewUrl()" />
      <button
        (click)="removeImage()"
        class="absolute right-2 top-2 rounded-full bg-black/60 p-1 text-white backdrop-blur-sm cursor-pointer"
      >
        <svg lucideX class="size-4"></svg>
      </button>
    </div>
  }

  <!-- Footer Actions -->
  <div
    class="mt-3 flex flex-wrap items-center justify-between gap-2 border-t border-slate-200 pt-3 dark:border-slate-800"
  >
    <div class="relative flex items-center gap-2">
      <!-- Image Upload -->
      <label
        class="flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
      >
        <svg lucideImage class="size-4.5 text-emerald-600 dark:text-emerald-400"></svg>
        <span class="hidden sm:inline">Photo</span>
        <input accept="image/*" class="hidden" type="file" (change)="onFileSelected($event)" />
      </label>

      <!-- Emoji -->
      <button
      (click)="toggleEmojiPicker()"
        type="button"
        class="flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
      >
        <svg lucideFaceSlightlySmiling class="size-4.5 text-amber-500 dark:text-amber-400"></svg>
        <span class="hidden sm:inline">Emoji</span>
      </button>

      @if (showEmojiPicker()) {
        <div (appClickOutside)="showEmojiPicker.set(false)"
          class="absolute left-0 top-[calc(100%+8px)] z-20 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl"
        >
          <app-emoji-picker (emojiSelected)="addEmoji($event)" />
        </div>
      }
    </div>

    <!-- Create Post Button -->
    <div class="flex items-center gap-3">
      <button
        (click)="onPostClick()"
        [disabled]="!body() && !selectedFile()"
        class="flex items-center gap-2 rounded-xl bg-[#1877f2] px-5 py-2 text-sm font-extrabold text-white shadow-sm transition-colors hover:bg-[#166fe5] enabled:cursor-pointer disabled:cursor-not-allowed disabled:opacity-50 dark:bg-blue-600 dark:hover:bg-blue-500 dark:disabled:bg-slate-800 dark:disabled:text-slate-500 dark:disabled:opacity-100"
      >
        Post
        <svg lucideSend class="size-4"></svg>
      </button>
    </div>
  </div>
</div>

<div class="flex items-start gap-2">
  <img
    [alt]="profileFacade.myData()?.name"
    class="h-9 w-9 rounded-full object-cover ring-1 ring-slate-200 dark:ring-slate-700"
    [src]="profileFacade.myData()?.photo"
  />
  <div
    class="w-full rounded-2xl border border-slate-200 bg-[#f0f2f5] px-2.5 py-1.5 transition-colors focus-within:border-[#c7dafc] focus-within:bg-white dark:border-slate-800 dark:bg-slate-900 dark:focus-within:border-blue-500/60 dark:focus-within:bg-slate-900"
  >
    <textarea
      [(ngModel)]="body"
      [placeholder]="'Comment as ' + profileFacade.myData()?.name + '...'"
      rows="1"
      class="max-h-35 min-h-10 w-full resize-none bg-transparent px-2 py-1.5 text-sm leading-5 text-slate-800 outline-none placeholder:text-slate-500 dark:text-slate-100 dark:placeholder:text-slate-400"
    ></textarea>

    <!-- Action Buttons Bar -->
    <div class="mt-1 flex items-center justify-between">
      <div class="flex items-center gap-1">
        <label
          class="inline-flex cursor-pointer items-center justify-center rounded-full p-2 text-slate-500 transition hover:bg-slate-200 hover:text-emerald-600 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-emerald-400"
        >
          <svg lucideImage class="size-4"></svg>
          <input accept="image/*" class="hidden" type="file" (change)="onFileSelected($event)" />
        </label>
        <button
          (click)="toggleEmojiPicker()"
          type="button"
          class="inline-flex cursor-pointer items-center justify-center rounded-full p-2 text-slate-500 transition hover:bg-slate-200 hover:text-amber-500 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-amber-400"
          cdkOverlayOrigin
          #emojiPickerTrigger="cdkOverlayOrigin"
        >
          <svg lucideFaceSlightlySmiling class="size-4"></svg>
        </button>
        <ng-template
          cdkConnectedOverlay
          [cdkConnectedOverlayOrigin]="emojiPickerTrigger"
          [cdkConnectedOverlayOpen]="showEmojiPicker()"
          [cdkConnectedOverlayHasBackdrop]="true"
          cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
          (backdropClick)="showEmojiPicker.set(false)"
          (detach)="showEmojiPicker.set(false)"
        >
          <div class="ml-2 mt-2">
            <app-emoji-picker (emojiSelected)="addEmoji($event)" />
          </div>
        </ng-template>
      </div>

      <!-- Submit Button -->
      <button
        (click)="submit()"
        class="inline-flex h-9 w-9 enabled:cursor-pointer items-center justify-center rounded-full bg-[#1877f2] text-white shadow-sm transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:bg-[#9ec5ff] disabled:opacity-100 dark:bg-blue-600 dark:hover:bg-blue-500 dark:disabled:bg-slate-800 dark:disabled:text-slate-500"
        [disabled]="invalid() || loading()"
      >
        @if (loading()) {
          <svg lucideLoaderCircle class="size-4 animate-spin"></svg>
        } @else {
          <svg lucideSendHorizontal class="size-4"></svg>
        }
      </button>
    </div>
  </div>
</div>
@if (previewUrl()) {
  <div class="relative mt-2">
    <img
      alt="Comment preview"
      class="max-h-52 w-full rounded-lg object-cover"
      [src]="previewUrl()"
    />
    <button
      (click)="removeImage()"
      type="button"
      class="absolute right-2 top-2 rounded-full bg-black/60 p-1 text-white cursor-pointer"
    >
      <svg lucideX class="size-3.5"></svg>
    </button>
  </div>
}

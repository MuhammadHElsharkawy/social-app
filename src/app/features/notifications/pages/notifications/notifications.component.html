<section
  class="rounded-xl border border-slate-200 bg-white shadow-sm transition-colors duration-200 dark:border-slate-800 dark:bg-slate-900 dark:shadow-xl dark:shadow-black/30 sm:rounded-2xl"
>
  <!-- Header Section -->
  <div class="border-b border-slate-200 p-4 dark:border-slate-800 sm:p-5">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h2 class="text-xl font-black text-slate-900 dark:text-slate-100 sm:text-2xl">
          Notifications
        </h2>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
          Realtime updates for likes, comments, shares, and follows.
        </p>
      </div>
      <button
        [disabled]="notificationsFacade.unreadNotificationsCount() === 0"
        class="inline-flex w-full enabled:cursor-pointer items-center justify-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 transition enabled:hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-60 dark:border-slate-700/80 dark:bg-slate-800/80 dark:text-slate-200 enabled:dark:hover:bg-slate-700 sm:w-auto"
        (click)="handleReadAll()"
      >
        <svg lucideCheckCheck class="size-3.75"></svg>
        Mark all as read
      </button>
    </div>

    <!-- Filter Buttons Bar -->
    <div class="mt-4 grid grid-cols-2 gap-2 sm:flex sm:items-center">
      <button
        (click)="handleNotificationsFilter('all')"
        type="button"
        class="cursor-pointer rounded-full px-4 py-1.5 text-sm font-bold transition"
        [class]="
          notificationsFacade.notificationsFilter() === 'all'
            ? 'bg-[#1877f2] text-white dark:bg-blue-600'
            : 'bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700'
        "
      >
        All
      </button>
      <button
        (click)="handleNotificationsFilter('unread')"
        type="button"
        class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-full px-4 py-1.5 text-sm font-bold transition"
        [class]="
          notificationsFacade.notificationsFilter() === 'unread'
            ? 'bg-[#1877f2] text-white dark:bg-blue-600'
            : 'bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700'
        "
      >
        Unread
        @if (notificationsFacade.unreadNotificationsCount() > 0) {
          <span
            class="rounded-full px-2 py-0.5 text-xs transition-colors"
            [class]="
              notificationsFacade.notificationsFilter() === 'unread'
                ? 'bg-white/25 text-white'
                : 'bg-white text-[#1877f2] dark:bg-slate-900 dark:text-blue-400'
            "
          >
            {{ notificationsFacade.unreadNotificationsCount() }}
          </span>
        }
      </button>
    </div>
  </div>

  <!-- Notifications List -->
  <div class="space-y-2 p-3 sm:p-4">
    @if (notificationsFacade.getNotificationsLoading()) {
      <app-notification-loading></app-notification-loading>
    } @else if (notificationsFacade.filteredNotificationsList().length === 0) {
      <app-notifications-empty
        [msg]="
          notificationsFacade.notificationsFilter() === 'unread'
            ? 'No unread notifications yet.'
            : 'No notifications yet.'
        "
      ></app-notifications-empty>
    } @else {
      @for (item of notificationsFacade.filteredNotificationsList(); track item._id) {
        <div>
          <app-notification-card
            [notification]="item"
            (readNotification)="handleReadNotification($event)"
          ></app-notification-card>
        </div>
      }
    }
  </div>
</section>

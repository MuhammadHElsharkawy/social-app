<section>
  <div class="head">
    <h2 class="text-2xl font-extrabold text-slate-900 dark:text-slate-100">Log in to Loomy</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
      Log in and continue your social journey.
    </p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="login()" class="mt-5">
    <!-- Email Field -->
    <div class="mb-3.5">
      <lib-input
        formControlName="email"
        inputId="loginEmail"
        type="text"
        placeholder="Email or username"
        [attr.aria-describedby]="loginEmailError.id()"
        [attr.aria-invalid]="
          loginForm.controls['email'].invalid && loginForm.controls['email'].touched
        "
      >
        <svg
          lucideUser
          class="size-4.5 text-slate-400 dark:text-slate-500"
          strokeWidth="2"
          #inputIcon
        ></svg>
      </lib-input>
      <lib-field-error
        #loginEmailError
        [control]="loginForm.controls['email']"
        label="Email or username"
        [customMessages]="{
          minlength: (e) => 'Please enter a valid email or username.',
        }"
      ></lib-field-error>
    </div>

    <!-- Password Field -->
    <div class="mb-3.5">
      <lib-input
        formControlName="password"
        inputId="loginPassword"
        type="password"
        placeholder="Password"
        [attr.aria-describedby]="loginPasswordError.id()"
        [attr.aria-invalid]="
          loginForm.controls['password'].invalid && loginForm.controls['password'].touched
        "
      >
        <svg
          lucideKeyRound
          class="size-4.5 text-slate-400 dark:text-slate-500"
          strokeWidth="2"
          #inputIcon
        ></svg>
      </lib-input>
      <lib-field-error
        #loginPasswordError
        [control]="loginForm.controls['password']"
        label="Password"
      ></lib-field-error>
    </div>

    <!-- Submit CTA Button -->
    <div class="mb-3.5 text-center">
      <button
        [disabled]="isLoading()"
        class="w-full rounded-xl bg-blue-900 px-4 py-3 font-bold text-white transition enabled:cursor-pointer hover:scale-105 disabled:cursor-no-drop disabled:bg-gray-500 disabled:scale-100 dark:bg-blue-600 dark:hover:bg-blue-500 dark:disabled:bg-slate-700 dark:disabled:text-slate-400"
      >
        @if (!isLoading()) {
          Log In <i class="fa-solid fa-arrow-right"></i>
        }
        @if (isLoading()) {
          Please wait...
        }
      </button>
    </div>

    <!-- Forgot Password Link -->
    <div class="text-center">
      <button
        type="button"
        class="cursor-pointer text-sm font-semibold text-[#00298d] transition hover:underline dark:text-blue-400 dark:hover:text-blue-300"
      >
        Forget Password
      </button>
    </div>

    <!-- Error Banner -->
    @if (errorMessage() !== null) {
      <app-form-error-message
        [errorMessage]="errorMessage()"
        styleType="auth"
      ></app-form-error-message>
    }
  </form>
</section>

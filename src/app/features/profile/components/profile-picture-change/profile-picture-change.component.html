<div class="fixed inset-0 z-90 flex items-center justify-center bg-black/70 p-4">
  <div
    (appClickOutside)="handleCloseClick()"
    class="w-full max-w-140 rounded-2xl border border-slate-200 bg-white p-4 shadow-xl sm:p-5"
  >
    <div class="mb-3">
      <h3 class="text-lg font-extrabold text-slate-900">Adjust profile photo</h3>
      <p class="text-sm text-slate-500">Drag to reposition and use zoom for perfect framing.</p>
    </div>
    <div class="mx-auto w-full max-w-85 overflow-x-auto pb-1">
      <div
        #cropArea
        class="relative aspect-square w-full overflow-hidden rounded-2xl border border-slate-200 cursor-grab active:cursor-grabbing"
      >
        <img
          #image
          [src]="picturePreview()"
          alt="Profile preview"
          draggable="false"
          class="absolute left-1/2 top-1/2 max-w-none select-none"
          [style.width.px]="displayedWidth()"
          [style.height.px]="displayedHeight()"
          [style.transform]="imageTransform()"
          (load)="onImageLoad(image, cropArea)"
          (pointerdown)="onPointerDown($event)"
          (pointermove)="onPointerMove($event)"
          (pointerup)="onPointerUp()"
          (pointercancel)="onPointerUp()"
        />
      </div>
    </div>
    <div class="mt-4 space-y-2">
      <div class="flex items-center justify-between text-xs font-bold text-slate-500">
        <span>Zoom</span><span> {{ zoomLevel().toFixed(2) }}x</span>
      </div>
      <input
        type="range"
        min="1"
        max="3"
        step="0.01"
        class="h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-200 accent-[#1877f2]"
        [value]="zoomLevel()"
        (input)="onZoomChange($event)"
      />
    </div>
    <div class="mt-4">
      <p class="mb-1 text-xs font-bold uppercase tracking-wide text-slate-500">Post privacy</p>
      <select
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 outline-none focus:border-[#1877f2]"
      >
        <option value="public">Public</option>
        <option value="following">Followers</option>
        <option value="only_me">Only me</option>
      </select>
    </div>
    <div class="mt-5 flex items-center justify-end gap-2">
      <button
        type="button"
        class="inline-flex items-center rounded-lg border border-slate-300 px-4 py-2 text-sm font-bold text-slate-600 transition hover:bg-slate-50"
        [disabled]="loading()"
        (click)="handleCloseClick()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="inline-flex items-center rounded-lg bg-[#1877f2] px-4 py-2 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="loading()"
        (click)="handleSubmit()"
      >
        @if (loading()) {
          Saving...
        } @else {
          Save photo
        }
      </button>
    </div>
  </div>
</div>

<div
  class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition-colors duration-200 dark:border-slate-800 dark:bg-slate-900 dark:shadow-xl dark:shadow-black/30"
>
  <div class="mb-3 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2">
      <svg lucideUsers class="size-4.5 text-[#1877f2] dark:text-blue-400"></svg>
      <h3 class="text-base font-extrabold text-slate-900 dark:text-slate-100">Suggested Friends</h3>
    </div>
    <span
      class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-bold text-slate-600 dark:bg-slate-800 dark:text-slate-300"
      >5</span
    >
  </div>
  <div class="mb-3">
    <label class="relative block">
      <svg
        lucideSearch
        class="size-3.75 pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"
      ></svg>
      <input
        placeholder="Search friends..."
        class="w-full rounded-xl border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-sm text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-[#1877f2] focus:bg-white dark:border-slate-800 dark:bg-slate-950/60 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-blue-400 dark:focus:bg-slate-950"
      />
    </label>
  </div>
  <div class="space-y-3">
    @if (suggestionsFacade.getSuggestionsLoading()) {
      <app-follow-suggestion-loading></app-follow-suggestion-loading>
    } @else if (suggestionsFacade.suggestionsList().length > 0) {
      @for (item of suggestionsFacade.suggestionsList(); track item._id) {
        <div>
          <app-follow-suggestion-card
            [suggestion]="item"
            [followLoading]="userFacade.toggleFollowUserLoading() === item._id"
            (onFollow)="onFollowClick($event)"
          ></app-follow-suggestion-card>
        </div>
      }
    }
  </div>
  <button
    class="mt-3 inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-100 dark:border-slate-800 dark:bg-slate-800/60 dark:text-slate-200 dark:hover:bg-slate-800"
  >
    View more
  </button>
</div>

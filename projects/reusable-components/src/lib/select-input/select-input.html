<div class="flex flex-col gap-1">
  @if (label()) {
    <label [for]="inputId()" class="text-sm font-medium text-slate-700 dark:text-slate-300">
      {{ label() }}
    </label>
  }

  <div class="relative">
    <select
      [id]="inputId()"
      [value]="value()"
      (change)="handleChange($event)"
      (blur)="onBlur()"
      [disabled]="isDisabled()"
      class="w-full rounded-xl border bg-slate-50 py-3 pr-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:bg-white dark:bg-slate-950/60 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:bg-slate-900"
      [class]="styleClass()"
      [class.pl-11]="hasIcon()"
      [class.pl-4]="!hasIcon()"
      [class]="
        isInvalid()
          ? 'border-rose-300 focus:border-rose-400 dark:border-rose-400 dark:focus:border-rose-300'
          : 'border-slate-200 focus:border-[#00298d] dark:border-slate-700 dark:focus:border-blue-400'
      "
    >
      <option value="" disabled>{{ placeholder() }}</option>
      @for (option of options(); track $index) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>

    <div class="absolute top-1/2 -translate-y-1/2 left-3 pointer-events-none">
      <ng-content />
    </div>
  </div>
</div>
